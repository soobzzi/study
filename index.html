e": "Reservation은 MAC 주소(Client ID)에 특정 IP를 고정 배정한다.", "tip": ""}, {"cat": "Windows실전", "q": "DHCP 새 범위를 생성한 뒤 클라이언트에게 실제 주소를 배포하려면 마지막에 무엇을 해야 하는가?", "a": ["범위 활성화", "활성화", "activate"], "e": "범위를 활성화해야 DHCP 서버가 해당 범위에서 주소를 배포한다.", "tip": ""}, {"cat": "Windows실전", "q": "DNS에 새 정방향 조회 영역을 만들 때 대표적으로 우클릭하는 항목은?", "a": ["정방향 조회 영역", "forward lookup zones"], "e": "DNS 관리자에서 '정방향 조회 영역'을 우클릭해 새 영역을 만든다.", "tip": ""}, {"cat": "Windows실전", "q": "DNS에서 도메인 이름을 IPv4 주소로 연결할 때 생성하는 레코드는?", "a": ["a", "a 레코드"], "e": "A 레코드는 호스트 이름을 IPv4 주소로 매핑한다.", "tip": ""}, {"cat": "Windows실전", "q": "DNS에서 IP 주소를 이름으로 역조회하려면 어떤 영역이 필요할까?", "a": ["역방향 조회 영역", "reverse lookup zone", "reverse lookup zones"], "e": "PTR 레코드를 사용하려면 역방향 조회 영역이 필요하다.", "tip": ""}, {"cat": "Windows실전", "q": "Windows 방화벽에서 특정 포트를 허용하려면 일반적으로 어떤 규칙을 새로 만드는가?", "a": ["인바운드 규칙", "inbound rule", "인바운드"], "e": "외부에서 들어오는 특정 포트를 허용하려면 인바운드 규칙을 만든다.", "tip": ""}, {"cat": "Windows실전", "q": "Windows 방화벽에서 새 인바운드 규칙 유형 중 TCP/UDP 포트를 지정하려면 어떤 유형을 고르는가?", "a": ["포트", "port"], "e": "새 인바운드 규칙에서 '포트' 유형을 선택해 TCP 또는 UDP와 포트를 지정한다.", "tip": ""}, {"cat": "Windows실전", "q": "DHCP 서버에서 192.168.10.100~192.168.10.200 범위를 배포하되 192.168.10.100~110을 제외하고 게이트웨이를 192.168.10.1로 설정하려 한다. 설정 순서를 간단히 쓰시오.", "a": ["새 범위 생성 > 주소 범위 설정 > 제외 주소 설정 > 라우터 옵션 설정 > 범위 활성화", "새 범위 > 범위 설정 > 제외 주소 > 003 라우터 > 활성화"], "e": "DHCP 실전은 보통 범위 생성 → 배포 범위 → 제외 주소 → 옵션(003 Router 등) → 활성화 순서로 기억하면 된다.", "tip": ""}, {"cat": "Windows실전", "q": "DNS에서 host.example.com을 192.168.1.20으로 연결하려 한다. 어떤 영역에서 어떤 레코드를 추가하는가?", "a": ["정방향 조회 영역 a 레코드", "정방향 조회 영역 > a 레코드", "forward lookup zone a record"], "e": "이름 → IPv4 주소는 정방향 조회 영역의 A 레코드다.", "tip": ""}, {"cat": "Windows실전", "q": "Windows 방화벽에서 TCP 8080 포트를 외부에서 허용하는 설정 흐름은?", "a": ["인바운드 규칙 > 새 규칙 > 포트 > tcp > 8080 > 연결 허용", "인바운드 > 새 규칙 > 포트 > tcp > 8080 > 허용"], "e": "외부에서 들어오는 트래픽이므로 인바운드 규칙을 만들고 Port/TCP/8080/Allow 순서로 설정한다.", "tip": ""}, {"cat": "Router실전", "q": "FastEthernet0/0에 192.168.1.1/24를 설정하고 인터페이스를 활성화한 뒤 저장하시오. 핵심 명령어 순서를 쓰시오.", "a": ["enable > configure terminal > interface fastethernet 0/0 > ip address 192.168.1.1 255.255.255.0 > no shutdown > end > copy running-config startup-config", "enable > conf t > int fa0/0 > ip address 192.168.1.1 255.255.255.0 > no shutdown > end > copy run start"], "e": "핵심은 특권 모드 → 전역 설정 → 인터페이스 → IP/마스크 → no shutdown → 종료 → 저장이다.", "tip": ""}, {"cat": "Router실전", "q": "라우터 호스트명을 ICQA로 변경하고 enable secret을 network로 설정한 뒤 저장하는 명령 흐름은?", "a": ["enable > configure terminal > hostname icqa > enable secret network > end > copy running-config startup-config", "enable > conf t > hostname icqa > enable secret network > end > copy run start"], "e": "hostname은 전역 설정 모드에서, enable secret도 전역 설정 모드에서 설정한다.", "tip": ""}, {"cat": "Router실전", "q": "192.168.100.0/24를 DHCP로 배포하고 게이트웨이 192.168.100.1, DNS 8.8.8.8을 지정하며 192.168.100.1~10은 제외하려 한다. 핵심 설정 순서를 쓰시오.", "a": ["ip dhcp excluded-address 192.168.100.1 192.168.100.10 > ip dhcp pool icqa > network 192.168.100.0 255.255.255.0 > default-router 192.168.100.1 > dns-server 8.8.8.8", "ip dhcp pool icqa > network 192.168.100.0 255.255.255.0 > default-router 192.168.100.1 > dns-server 8.8.8.8 > exit > ip dhcp excluded-address 192.168.100.1 192.168.100.10"], "e": "제외 주소는 전역 설정 모드에서 지정한다. 풀 안에서는 network, default-router, dns-server를 설정한다.", "tip": ""}, {"cat": "Router실전", "q": "내부망 192.168.1.0/24를 Fa0/0, 외부망을 Fa0/1로 두고 PAT(NAT Overload)를 적용하는 핵심 명령 순서는?", "a": ["access-list 1 permit 192.168.1.0 0.0.0.255 > interface fastethernet 0/0 > ip nat inside > interface fastethernet 0/1 > ip nat outside > ip nat inside source list 1 interface fastethernet 0/1 overload", "access-list 1 permit 192.168.1.0 0.0.0.255 > int fa0/0 > ip nat inside > int fa0/1 > ip nat outside > ip nat inside source list 1 interface fa0/1 overload"], "e": "PAT는 ① 내부 대역 ACL 정의 ② inside 지정 ③ outside 지정 ④ inside source ... overload 순서를 기억하면 된다.", "tip": ""}, {"cat": "Router실전", "q": "목적지 10.10.0.0/16을 다음 홉 192.168.1.254로 보내는 정적 라우트를 설정하는 명령은?", "a": ["ip route 10.10.0.0 255.255.0.0 192.168.1.254"], "e": "정적 라우트 형식은 ip route [목적지 네트워크] [서브넷 마스크] [다음 홉]이다.", "tip": ""}, {"cat": "Router실전", "q": "기본 경로를 다음 홉 203.0.113.1로 설정하는 명령은?", "a": ["ip route 0.0.0.0 0.0.0.0 203.0.113.1"], "e": "기본 경로는 목적지와 마스크를 모두 0.0.0.0으로 지정한다.", "tip": ""}, {"cat": "Router실전", "q": "표준 ACL 10에서 192.168.1.0/24를 허용하는 명령은?", "a": ["access-list 10 permit 192.168.1.0 0.0.0.255"], "e": "표준 ACL은 소스 주소를 기준으로 하며 와일드카드 마스크를 사용한다.", "tip": ""}, {"cat": "Router실전", "q": "192.168.1.0/24의 와일드카드 마스크는?", "a": ["0.0.0.255"], "e": "와일드카드는 서브넷 마스크를 비트 반전한다. 255.255.255.0 → 0.0.0.255.", "tip": ""}, {"cat": "Router실전", "q": "255.255.255.192의 와일드카드 마스크는?", "a": ["0.0.0.63"], "e": "255에서 각 옥텟 값을 빼면 된다. 마지막 옥텟은 255-192=63.", "tip": ""}, {"cat": "Router실전", "q": "Cisco CLI에서 Router> 프롬프트는 어떤 모드인가?", "a": ["user exec", "사용자 exec", "사용자 모드"], "e": "Router>는 User EXEC 모드다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco CLI에서 Router# 프롬프트는 어떤 모드인가?", "a": ["privileged exec", "특권 exec", "관리자 모드", "특권 모드"], "e": "Router#는 Privileged EXEC 모드다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco CLI에서 Router(config)# 프롬프트는 어떤 모드인가?", "a": ["global configuration", "전역 설정", "전역 설정 모드"], "e": "Router(config)#는 Global Configuration 모드다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco CLI에서 Router(config-if)# 프롬프트는 어떤 모드인가?", "a": ["interface configuration", "인터페이스 설정", "인터페이스 설정 모드"], "e": "특정 인터페이스 설정 모드다.", "tip": ""}, {"cat": "Router실전", "q": "현재 한 단계 상위 설정 모드로 나가는 Cisco 명령어는?", "a": ["exit"], "e": "exit는 현재 모드에서 한 단계 위로 이동한다.", "tip": ""}, {"cat": "Router실전", "q": "설정 모드에서 privileged EXEC 모드로 즉시 돌아가는 명령어는?", "a": ["end"], "e": "end는 여러 단계 설정 모드에서 Router#로 바로 복귀한다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco에서 현재 설정 중 특정 문자열을 빠르게 확인하는 명령 조합의 핵심은?", "a": ["show running-config"], "e": "실전에서는 show running-config 또는 축약형 show run으로 현재 설정을 검증한다.", "tip": ""}, {"cat": "Router실전", "q": "인터페이스 상태가 administratively down이면 가장 먼저 의심할 명령은?", "a": ["shutdown"], "e": "관리자가 shutdown 명령으로 인터페이스를 비활성화한 상태라는 뜻이다.", "tip": ""}, {"cat": "Router실전", "q": "인터페이스를 켰는데 line protocol이 down이면 물리/상대 장비/링크 설정을 점검해야 하는가?", "a": ["예"], "e": "인터페이스 자체는 up이어도 line protocol down이면 링크 계층 문제일 수 있다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco 라우터에서 배너 메시지를 설정할 때 자주 쓰는 명령은?", "a": ["banner motd"], "e": "banner motd는 로그인 전 Message of the Day를 표시한다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco에서 콘솔 라인에 비밀번호를 적용하려면 password 설정 외에 필요한 명령은?", "a": ["login"], "e": "line console 설정에서 password만 지정하고 login을 빼면 비밀번호 인증이 적용되지 않을 수 있다.", "tip": ""}, {"cat": "Router실전", "q": "Cisco VTY 라인에서 SSH만 허용할 때 사용하는 대표 명령은?", "a": ["transport input ssh"], "e": "VTY 설정에서 transport input ssh를 사용하면 SSH만 허용한다.", "tip": ""}, {"cat": "트러블슈팅", "q": "PC에서 IP 주소가 169.254.x.x로 자동 설정되었다. 가장 먼저 의심할 서비스는?", "a": ["dhcp"], "e": "APIPA 대역은 DHCP 서버에서 주소를 받지 못했을 때 흔히 나타난다.", "tip": ""}, {"cat": "트러블슈팅", "q": "IP 주소로는 서버에 접속되지만 도메인 이름으로는 접속되지 않는다. 가장 먼저 의심할 서비스는?", "a": ["dns"], "e": "IP 통신은 되지만 이름 해석만 실패하므로 DNS 문제 가능성이 높다.", "tip": ""}, {"cat": "트러블슈팅", "q": "같은 LAN의 다른 PC와 통신이 안 되고 ARP 테이블에도 상대 MAC이 없다. 우선 확인할 계층은?", "a": ["2계층", "데이터 링크", "데이터링크"], "e": "같은 LAN 내 직접 통신은 MAC/ARP와 2계층 연결 상태가 중요하다.", "tip": ""}, {"cat": "트러블슈팅", "q": "기본 게이트웨이가 잘못 설정되었을 때 같은 서브넷 내부 통신은 가능할 수 있는가?", "a": ["예", "가능"], "e": "같은 서브넷 통신은 라우터를 거치지 않으므로 가능할 수 있지만 외부망 통신이 실패한다.", "tip": ""}, {"cat": "트러블슈팅", "q": "DNS 서버가 잘못 설정되어도 ping 8.8.8.8은 성공할 수 있는가?", "a": ["예", "가능"], "e": "IP 주소 직접 통신에는 DNS 이름 해석이 필요 없다.", "tip": ""}, {"cat": "트러블슈팅", "q": "ping 127.0.0.1이 실패하면 우선 자신의 TCP/IP 스택 이상을 의심할 수 있는가?", "a": ["예", "가능"], "e": "127.0.0.1은 로컬 loopback이므로 외부 네트워크 장비를 거치지 않는다.", "tip": ""}, {"cat": "트러블슈팅", "q": "ping 기본 게이트웨이는 되지만 외부 인터넷 IP는 안 된다. 어느 쪽 문제 가능성이 더 높은가?", "a": ["라우터 이후", "외부망", "상위 라우팅"], "e": "로컬 LAN과 게이트웨이까지는 정상일 가능성이 높고 이후 라우팅/NAT/회선 등을 점검한다.", "tip": ""}, {"cat": "트러블슈팅", "q": "tracert에서 첫 번째 홉이 일반적으로 무엇인가?", "a": ["기본 게이트웨이"], "e": "외부 목적지로 가는 경로의 첫 홉은 보통 로컬 기본 게이트웨이다.", "tip": ""}, {"cat": "서브넷실전", "q": "/24 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.255"], "e": "/24의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.255가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/25 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.127"], "e": "/25의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.127가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/26 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.63"], "e": "/26의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.63가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/27 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.31"], "e": "/27의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.31가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/28 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.15"], "e": "/28의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.15가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/29 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.7"], "e": "/29의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.7가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/30 서브넷의 와일드카드 마스크는?", "a": ["0.0.0.3"], "e": "/30의 서브넷 마스크를 255에서 각 옥텟별로 빼면 와일드카드 0.0.0.3가 된다.", "tip": ""}, {"cat": "서브넷실전", "q": "/25의 블록 크기는?", "a": ["128", "128개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /25의 블록 크기는 128다.", "tip": ""}, {"cat": "서브넷실전", "q": "/26의 블록 크기는?", "a": ["64", "64개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /26의 블록 크기는 64다.", "tip": ""}, {"cat": "서브넷실전", "q": "/27의 블록 크기는?", "a": ["32", "32개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /27의 블록 크기는 32다.", "tip": ""}, {"cat": "서브넷실전", "q": "/28의 블록 크기는?", "a": ["16", "16개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /28의 블록 크기는 16다.", "tip": ""}, {"cat": "서브넷실전", "q": "/29의 블록 크기는?", "a": ["8", "8개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /29의 블록 크기는 8다.", "tip": ""}, {"cat": "서브넷실전", "q": "/30의 블록 크기는?", "a": ["4", "4개"], "e": "마스크의 관심 옥텟에서 256 - 마스크 값으로 구한다. /30의 블록 크기는 4다.", "tip": ""}];
let session=[],idx=0,correct=0,wrong=0,answered=false,mistakes=[];
const STORE="net2-study-big-v3";
let saved=JSON.parse(localStorage.getItem(STORE)||'{"wrongIds":[],"history":{},"total":0}');
if(!saved.wrongIds)saved.wrongIds=[];if(!saved.history)saved.history={};if(!saved.total)saved.total=0;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||"").toLowerCase().trim().replace(/[，]/g,",").replace(/\s*>\s*/g," > ").replace(/\s+/g," ").replace(/fastethernet/g,"fa").replace(/configure terminal/g,"conf t").replace(/interface fa/g,"int fa").replace(/copy running-config startup-config/g,"copy run start")}
function okay(user,answers){let u=norm(user);return answers.some(a=>norm(a)===u)}

function startSession(){
 let pool=QUESTIONS.map((q,i)=>({...q,id:i}));
 const cat=document.getElementById("category").value,mode=document.getElementById("mode").value;
 if(cat!=="all")pool=pool.filter(q=>q.cat===cat);
 if(mode==="wrong"){
   let w=pool.filter(q=>saved.wrongIds.includes(q.id));
   if(!w.length){alert("저장된 오답이 없어서 전체 문제로 시작할게!");w=pool}
   pool=[...w,...w,...w,...shuffle(pool).slice(0,Math.min(30,pool.length))];
 }
 if(mode==="never"){
   const fresh=pool.filter(q=>!saved.history[q.id]),old=pool.filter(q=>saved.history[q.id]);
   pool=[...shuffle(fresh),...shuffle(old)];
 }
 pool=shuffle(pool);
 if(mode==="mock20")pool=pool.slice(0,20);
 if(mode==="mock30")pool=pool.slice(0,30);
 if(mode==="mock50")pool=pool.slice(0,50);
 if(mode==="all"){
   const rep=shuffle(pool).slice(0,Math.min(70,Math.max(15,Math.floor(pool.length*.18))));
   pool=shuffle([...pool,...rep]);
 }
 if(!pool.length){alert("해당 분야 문제가 없어.");return}
 session=pool;idx=0;correct=0;wrong=0;answered=false;mistakes=[];
 document.getElementById("summary").className="summary";render();
}

function render(){
 if(!session.length)return;
 if(idx>=session.length){finish();return}
 const q=session[idx];
 cat.textContent=q.cat;count.textContent=`${idx+1} / ${session.length}`;question.textContent=q.q;
 answer.value="";feedback.className="feedback";explain.className="explain";submitBtn.textContent="정답 확인";
 bar.style.width=`${(idx/session.length)*100}%`;answered=false;updateStats();setTimeout(()=>answer.focus(),30);
}
function submitAnswer(){
 if(!session.length||idx>=session.length)return;if(answered){nextQuestion();return}
 const q=session[idx],val=answer.value;if(!val.trim())return;
 const ok=okay(val,q.a);saved.total++;saved.history[q.id]=(saved.history[q.id]||0)+1;
 if(ok){correct++;feedback.className="feedback good";feedback.innerHTML="✅ <b>정답!</b>";saved.wrongIds=saved.wrongIds.filter(id=>id!==q.id)}
 else{wrong++;feedback.className="feedback bad";feedback.innerHTML=`❌ <b>오답</b><br>정답: <b>${q.a[0]}</b>`;if(!saved.wrongIds.includes(q.id))saved.wrongIds.push(q.id);mistakes.push(q)}
 explain.className="explain show";explain.innerHTML=`<b>📘 해설</b><br>${q.e}`;
 localStorage.setItem(STORE,JSON.stringify(saved));answered=true;submitBtn.textContent="다음 문제";updateStats();
}
function showAnswer(){
 if(!session.length||idx>=session.length)return;const q=session[idx];
 feedback.className="feedback bad";feedback.innerHTML=`💡 정답: <b>${q.a[0]}</b>`;explain.className="explain show";explain.innerHTML=`<b>📘 해설</b><br>${q.e}`;
}
function nextQuestion(){if(!session.length)return;idx++;render()}
function retryCurrent(){if(!session.length||idx>=session.length)return;session.splice(Math.min(idx+2,session.length),0,session[idx]);alert("조금 뒤에 같은 문제가 다시 나오게 넣었어!");updateStats()}
function finish(){
 bar.style.width="100%";cat.textContent="완료";count.textContent="";question.innerHTML=`회차 완료 🎉<br>정답 ${correct} / 오답 ${wrong}`;
 feedback.className="feedback";explain.className="explain";
 const s=document.getElementById("summary");s.className="summary show";let total=correct+wrong,rate=total?Math.round(correct/total*100):0;
 let body=`<h2>이번 회차 결과</h2><p>정답률 <b>${rate}%</b> · 정답 ${correct}개 · 오답 ${wrong}개</p>`;
 if(mistakes.length){body+=`<h3>오답 복습</h3><table><tr><th>분야</th><th>문제</th><th>정답</th><th>해설</th></tr>`;mistakes.slice(0,100).forEach(q=>body+=`<tr><td>${q.cat}</td><td>${q.q}</td><td>${q.a[0]}</td><td>${q.e}</td></tr>`);body+="</table>"}
 s.innerHTML=body;updateStats();
}
function updateStats(){sNow.textContent=session.length?`${Math.min(idx+1,session.length)}/${session.length}`:"0/0";sCorrect.textContent=correct;sWrong.textContent=wrong;sWrongBank.textContent=saved.wrongIds.length;sTotal.textContent=saved.total}
function resetProgress(){if(confirm("누적 오답/풀이 기록을 초기화할까?")){saved={wrongIds:[],history:{},total:0};localStorage.setItem(STORE,JSON.stringify(saved));updateStats()}}
answer.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();answered?nextQuestion():submitAnswer()}});
updateStats();
</script>
